global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 10s
    timeout client 120s
    timeout server 120s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend leaflens_frontend
    bind *:8003
    default_backend leaflens_api

backend leaflens_api
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server-template api 1-5 api:8000 check resolvers docker init-addr libc,none inter 3s fall 3 rise 2
